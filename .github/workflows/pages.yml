name: Publish Niffy Coach
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published board and engine
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          curl --fail --retry 6 --retry-all-errors --max-time 30 "${SITE_URL%/}/?release=${GITHUB_SHA}" -o /tmp/niffy-index.html
          grep -F '<title>niffy_coach' /tmp/niffy-index.html
          curl --fail --retry 6 --retry-all-errors --max-time 45 "${SITE_URL%/}/vendor/stockfish.wasm" -o /tmp/niffy-stockfish.wasm
          cmp site/vendor/stockfish.wasm /tmp/niffy-stockfish.wasm
